<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mobile — Home — Doa Fácil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F7F8F5;color:#1A2B1A;}
*{box-sizing:border-box;}
a{color:#2D6A4F;text-decoration:none;}
button{cursor:pointer;font-family:inherit;border:none;}
input{font-family:inherit;}
</style>
</helmet>

<!-- Phone frame -->
<div style="width:390px;height:844px;background:#F7F8F5;overflow:hidden;display:flex;flex-direction:column;position:relative;">

  <!-- STATUS BAR -->
  <div style="background:#fff;padding:14px 20px 8px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
    <span style="font-size:13px;font-weight:700;color:#1A2B1A;">9:41</span>
    <div style="display:flex;align-items:center;gap:5px;">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#1A2B1A"><rect x="0" y="4" width="3" height="8" rx="1"/><rect x="4" y="2.5" width="3" height="9.5" rx="1"/><rect x="8" y="1" width="3" height="11" rx="1"/><rect x="12" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#1A2B1A"><path d="M8 3C10.5 3 12.7 4 14.3 5.6L15.7 4.2C13.7 2.2 11 1 8 1C5 1 2.3 2.2 0.3 4.2L1.7 5.6C3.3 4 5.5 3 8 3Z"/><path d="M8 6C9.6 6 11 6.6 12.1 7.6L13.5 6.2C12 4.9 10.1 4 8 4C5.9 4 4 4.9 2.5 6.2L3.9 7.6C5 6.6 6.4 6 8 6Z"/><circle cx="8" cy="10" r="1.5"/></svg>
      <div style="width:24px;height:12px;border:1.5px solid #1A2B1A;border-radius:3px;display:flex;align-items:center;padding:1px;"><div style="height:100%;width:75%;background:#2D6A4F;border-radius:1px;"></div></div>
    </div>
  </div>

  <!-- HEADER -->
  <div style="background:#fff;border-bottom:1px solid #E2EBE2;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:30px;height:30px;background:#2D6A4F;border-radius:8px;display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3C12 3 5 8 5 13.5C5 17.09 8.13 20 12 20C15.87 20 19 17.09 19 13.5C19 8 12 3 12 3Z" fill="#D8F3DC"/><path d="M12 7C12 7 9 10 9 13C9 14.65 10.34 16 12 16C13.66 16 15 14.65 15 13C15 10 12 7 12 7Z" fill="#fff"/></svg>
      </div>
      <span style="font-size:16px;font-weight:800;color:#1A2B1A;">Doa Fácil</span>
    </div>
    <span style="font-size:11px;font-weight:700;color:#2D6A4F;background:#D8F3DC;padding:5px 10px;border-radius:100px;">Cond. Verde Vida</span>
  </div>

  <!-- SCROLLABLE CONTENT -->
  <div style="flex:1;overflow-y:auto;padding-bottom:72px;">

    <!-- Search Bar -->
    <div style="padding:16px 20px 0;">
      <div style="display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E2EBE2;border-radius:12px;padding:0 14px;height:46px;">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="5.5" stroke="#8FA08F" stroke-width="1.5"/><path d="M15.5 15.5L13 13" stroke="#8FA08F" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" placeholder="O que você está procurando?" style="border:none;outline:none;flex:1;font-size:14px;color:#1A2B1A;background:transparent;" />
      </div>
    </div>

    <!-- Banner / Hero -->
    <div style="margin:16px 20px 0;background:linear-gradient(135deg,#2D6A4F 0%,#1A3D2B 100%);border-radius:18px;padding:24px 22px;position:relative;overflow:hidden;">
      <div style="position:absolute;right:-20px;bottom:-20px;font-size:80px;opacity:0.15;">🌿</div>
      <span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);border-radius:100px;padding:4px 12px;margin-bottom:10px;">
        <div style="width:6px;height:6px;border-radius:50%;background:#52B788;"></div>
        <span style="font-size:11px;font-weight:600;color:#D8F3DC;">127 itens disponíveis</span>
      </span>
      <h2 style="margin:0 0 10px;font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.3px;line-height:1.25;">Doe e encontre itens<br>no seu condomínio</h2>
      <button style="display:inline-flex;align-items:center;gap:7px;background:#fff;color:#2D6A4F;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 2V14M2 8H14" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round"/></svg>
        Publicar doação
      </button>
    </div>

    <!-- Categories Scroll -->
    <div style="padding:20px 0 0 20px;">
      <h3 style="margin:0 0 12px;font-size:14px;font-weight:700;color:#1A2B1A;">Categorias</h3>
      <div style="display:flex;gap:10px;overflow-x:auto;padding-right:20px;padding-bottom:4px;">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;">
            <div style="width:52px;height:52px;border-radius:14px;background:{{c.bg}};border:1.5px solid {{c.border}};display:flex;align-items:center;justify-content:center;font-size:22px;">{{c.icon}}</div>
            <span style="font-size:11px;font-weight:600;color:{{c.color}};white-space:nowrap;">{{c.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- Recent Items -->
    <div style="padding:20px 20px 0;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;font-size:14px;font-weight:700;color:#1A2B1A;">Doações recentes</h3>
        <a href="#" style="font-size:12px;font-weight:600;color:#2D6A4F;">Ver todos</a>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <sc-for list="{{mItems}}" as="item" hint-placeholder-count="3">
          <div style="background:#fff;border-radius:14px;border:1px solid #E2EBE2;display:flex;overflow:hidden;">
            <div style="width:88px;flex-shrink:0;background:{{item.imgBg}};display:flex;align-items:center;justify-content:center;font-size:36px;">{{item.emoji}}</div>
            <div style="flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:6px;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <span style="font-size:14px;font-weight:700;color:#1A2B1A;line-height:1.2;">{{item.name}}</span>
                <span style="background:{{item.badgeBg}};color:{{item.badgeColor}};font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;white-space:nowrap;flex-shrink:0;">{{item.status}}</span>
              </div>
              <div style="display:flex;gap:5px;">
                <span style="background:#F7F8F5;color:#5C6B5C;font-size:11px;font-weight:600;padding:2px 7px;border-radius:100px;">{{item.cat}}</span>
                <span style="background:#FEF3EB;color:#E07B39;font-size:11px;font-weight:600;padding:2px 7px;border-radius:100px;">{{item.cond}}</span>
              </div>
              <span style="font-size:11px;color:#8FA08F;">{{item.date}} · Bloco {{item.block}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <div style="position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E2EBE2;padding:10px 0 20px;display:flex;justify-content:space-around;align-items:center;">
    <sc-for list="{{navItems}}" as="nav" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:64px;">
        <div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:16px;">{{nav.icon}}</div>
        <span style="font-size:10px;font-weight:600;color:{{nav.color}};">{{nav.label}}</span>
      </div>
    </sc-for>
    <!-- FAB -->
    <div style="width:52px;height:52px;background:#2D6A4F;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(45,106,79,0.4);cursor:pointer;margin-top:-8px;">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none"><path d="M8 2V14M2 8H14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cats: [
        { icon:"🪑", label:"Móveis",   bg:"#D8F3DC", border:"#52B788", color:"#2D6A4F" },
        { icon:"⚡", label:"Eletrôn.", bg:"#fff",    border:"#E2EBE2", color:"#5C6B5C" },
        { icon:"👕", label:"Roupas",   bg:"#fff",    border:"#E2EBE2", color:"#5C6B5C" },
        { icon:"📚", label:"Livros",   bg:"#fff",    border:"#E2EBE2", color:"#5C6B5C" },
        { icon:"🧸", label:"Brinqued.",bg:"#fff",    border:"#E2EBE2", color:"#5C6B5C" },
        { icon:"🌱", label:"Plantas",  bg:"#fff",    border:"#E2EBE2", color:"#5C6B5C" }
      ],
      mItems: [
        { name:"Mesa de Escritório em L", emoji:"🗄️", imgBg:"#EEF7F1", cat:"Móveis",   cond:"Boa condição", status:"Disponível", badgeBg:"#D8F3DC", badgeColor:"#2D6A4F", date:"Hoje",    block:"A" },
        { name:"Bicicleta Infantil",       emoji:"🚲", imgBg:"#FEF3EB", cat:"Esportes", cond:"Usada",        status:"Disponível", badgeBg:"#D8F3DC", badgeColor:"#2D6A4F", date:"Ontem",   block:"B" },
        { name:"Livros de Culinária",      emoji:"📚", imgBg:"#EEF7F1", cat:"Livros",   cond:"Ótima",        status:"Reservado",  badgeBg:"#FEF3EB", badgeColor:"#E07B39", date:"2 dias",  block:"C" }
      ],
      navItems: [
        { icon:"🏠", label:"Início",     color:"#2D6A4F" },
        { icon:"🔍", label:"Explorar",   color:"#5C6B5C" },
        { icon:"📋", label:"Minhas doações",color:"#5C6B5C" }
      ]
    };
  }
}
</script>
</body>
</html>
